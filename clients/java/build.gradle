// com.voplica:voplica-api, the Voplica API for Java: every message, enum and gRPC service stub of the published protobuf
// definitions (../../proto), generated by protoc and protoc-gen-grpc-java at build time and never committed. The
// version is the API's (../../VERSION). Bytecode for Java 17, built with the Java 25 toolchain.
//
// The two generators come from the PATH, or from -Pvoplica.protoc=<path> and -Pvoplica.protocGenGrpcJava=<path>;
// .github/workflows/java.yml installs the pinned releases and checks their sha256 first. protoc must be the release
// that generates for this protobuf-java (protoc 34.1 for 4.34.1): the build refuses any other, because generated code
// newer than its runtime does not load.
plugins {
    id 'java-library'
    id 'maven-publish'
}

// The runtime and the generators; the workflow's PROTOC_VERSION and GRPC_JAVA_VERSION name the same releases
// (WorkflowTest compares them).
def protobufVersion = '4.34.1'
def protocVersion = '34.1'
def grpcVersion = '1.81.0'
def junitVersion = '6.1.1'

def versionFile = file('../../VERSION')
if (!versionFile.isFile()) {
    throw new GradleException("${versionFile} is missing: the client's version is the API's")
}
def apiVersion = versionFile.text.trim()
if (!(apiVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("${versionFile} holds \"${apiVersion}\", not X.Y.Z")
}
group = 'com.voplica'
version = apiVersion

// The published tree the client is generated from (-Pvoplica.protoDir=<dir> for another), and the files the tests read.
def protoDir = file(providers.gradleProperty('voplica.protoDir').getOrElse('../../proto'))
def workflowFile = file('../../.github/workflows/java.yml')
def licenseFile = file('../../LICENSE')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    api "io.grpc:grpc-stub:${grpcVersion}"

    // JsonFormat, for the README's JSON example (JsonApiExampleTest compiles it), at the runtime's version.
    testImplementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/** protoc over every .proto file of the published tree: the messages and enums (protoc's own Java generator) and the
 *  gRPC stubs (protoc-gen-grpc-java), each into a directory of its own that only this run fills. */
abstract class GenerateProtoSources extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getProtoDir()

    /** The well-known types the protos import (google/protobuf/*.proto), as protobuf-java's jar carries them. */
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getWellKnownTypesDir()

    @Input
    abstract Property<String> getProtoc()

    @Input
    @org.gradle.api.tasks.Optional
    abstract Property<String> getGrpcPlugin()

    @Input
    abstract Property<String> getProtocVersion()

    @OutputDirectory
    abstract DirectoryProperty getJavaOutput()

    @OutputDirectory
    abstract DirectoryProperty getGrpcOutput()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @javax.inject.Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void generate() {
        def reported = new ByteArrayOutputStream()
        execOperations.exec {
            it.commandLine(protoc.get(), '--version')
            it.standardOutput = reported
        }
        def expected = "libprotoc ${protocVersion.get()}".toString()
        def actual = reported.toString('UTF-8').trim()
        if (actual != expected) {
            throw new GradleException("${protoc.get()} is \"${actual}\", not \"${expected}\": install protoc ${protocVersion.get()} " +
                    "(the release that generates for this protobuf-java) or name it with -Pvoplica.protoc=<path>")
        }
        def wellKnownTypes = wellKnownTypesDir.get().asFile
        if (!new File(wellKnownTypes, 'google/protobuf/descriptor.proto').isFile()) {
            throw new GradleException("${wellKnownTypes} holds no google/protobuf/descriptor.proto")
        }
        def root = protoDir.get().asFile
        def protos = protoDir.get().asFileTree.matching { include '**/*.proto' }.files*.absolutePath.sort()
        if (protos.isEmpty()) {
            throw new GradleException("no .proto file under ${root}")
        }
        def javaOut = javaOutput.get().asFile
        def grpcOut = grpcOutput.get().asFile
        fileSystemOperations.delete { it.delete(javaOut, grpcOut) }
        javaOut.mkdirs()
        grpcOut.mkdirs()
        def arguments = [
                "--proto_path=${root}",
                "--proto_path=${wellKnownTypes}",
                "--java_out=${javaOut}",
                // No @javax.annotation.Generated on the stubs: the JDK has no such class since Java 11.
                '--grpc-java_opt=@generated=omit',
                "--grpc-java_out=${grpcOut}",
        ]*.toString()
        if (grpcPlugin.isPresent()) {
            arguments << "--plugin=protoc-gen-grpc-java=${grpcPlugin.get()}".toString()
        }
        execOperations.exec {
            it.commandLine([protoc.get()] + arguments + protos)
        }
    }
}

def extractWellKnownTypes = tasks.register('extractWellKnownTypes', Sync) {
    description = "Extracts the well-known types' .proto files from protobuf-java's jar."
    def compileClasspath = configurations.compileClasspath
    from({ compileClasspath.filter { it.name == "protobuf-java-${protobufVersion}.jar" }.collect { zipTree(it) } }) {
        include 'google/protobuf/**/*.proto'
    }
    into layout.buildDirectory.dir('well-known-types')
}

def generateProtoSources = tasks.register('generateProtoSources', GenerateProtoSources) {
    group = 'build'
    description = 'Generates the messages, enums and gRPC stubs of the published protos with protoc.'
    dependsOn extractWellKnownTypes
    it.protoDir = protoDir
    wellKnownTypesDir = layout.buildDirectory.dir('well-known-types')
    protoc = providers.gradleProperty('voplica.protoc').orElse('protoc')
    grpcPlugin = providers.gradleProperty('voplica.protocGenGrpcJava')
    it.protocVersion = protocVersion
    javaOutput = layout.buildDirectory.dir('generated/sources/protoc/java')
    grpcOutput = layout.buildDirectory.dir('generated/sources/protoc/grpc')
}

sourceSets {
    main {
        java {
            srcDir(generateProtoSources.flatMap { it.javaOutput })
            srcDir(generateProtoSources.flatMap { it.grpcOutput })
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc) {
    title = "Voplica API ${project.version}"
    maxMemory = '2g'
    options.encoding = 'UTF-8'
    options.quiet()
    options.addStringOption('-release', '17')
    // The comments are the protos' own, written for people rather than for doclint.
    options.addBooleanOption('Xdoclint:none', true)
    // The same sources make the same javadoc jar.
    options.addBooleanOption('notimestamp', true)
}

// Every archive the same bytes for the same sources, each with the licence.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Jar).configureEach {
    from(licenseFile) {
        into 'META-INF'
    }
}
tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.voplica.api',
                'Implementation-Title': 'Voplica API',
                'Implementation-Vendor': 'Voplica',
                'Implementation-Version': project.version)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = 'voplica-api'
            // The metadata Maven Central requires: a name, a description, a URL, the licence, a developer, the SCM.
            pom {
                name = 'Voplica API'
                description = 'The Voplica API for Java: every message, enum and gRPC service stub of the published ' +
                        'protobuf definitions, for protobuf-java and grpc-java.'
                url = 'https://docs.voplica.com/clients/'
                licenses {
                    license {
                        name = 'Apache-2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'voplica'
                        name = 'Voplica'
                        email = 'voplica@voplica.com'
                        organization = 'Voplica'
                        organizationUrl = 'https://voplica.com'
                    }
                }
                scm {
                    url = 'https://github.com/voplica/api'
                    connection = 'scm:git:https://github.com/voplica/api.git'
                    developerConnection = 'scm:git:ssh://git@github.com/voplica/api.git'
                }
            }
        }
    }
    repositories {
        // The Maven layout the Maven Central bundle is made of: scripts/central-bundle.sh signs and zips it.
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
        // GitHub Packages; the workflow passes GitHubPackagesUsername and GitHubPackagesPassword (the run's actor and
        // its GITHUB_TOKEN) as ORG_GRADLE_PROJECT_ variables.
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/voplica/api'
            credentials(PasswordCredentials)
        }
    }
}

// A fresh staged layout every time: only this version, nothing from an earlier one.
tasks.withType(PublishToMavenRepository).matching { it.name == 'publishMavenJavaPublicationToStagingRepository' }.configureEach {
    def staged = layout.buildDirectory.dir('staging-deploy')
    doFirst {
        delete staged
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The tests read the published tree and this workflow, and what the build made of them: the generated stubs,
    // the classes, the three jars and the POM.
    dependsOn 'generatePomFileForMavenJavaPublication', 'jar', 'sourcesJar', 'javadocJar'
    inputs.dir(protoDir).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('protos')
    inputs.file(workflowFile).withPathSensitivity(PathSensitivity.NONE).withPropertyName('workflow')
    inputs.file('README.md').withPathSensitivity(PathSensitivity.NONE).withPropertyName('readme')
    inputs.files(tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('javadocJar')).withPropertyName('jars')
    systemProperty 'voplica.version', project.version
    systemProperty 'voplica.protoDir', protoDir.absolutePath
    systemProperty 'voplica.workflow', workflowFile.absolutePath
    systemProperty 'voplica.grpcSources', layout.buildDirectory.dir('generated/sources/protoc/grpc').get().asFile.absolutePath
    systemProperty 'voplica.classes', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
    systemProperty 'voplica.pom', layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile.absolutePath
    systemProperty 'voplica.jar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'voplica.sourcesJar', tasks.named('sourcesJar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'voplica.javadocJar', tasks.named('javadocJar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'voplica.protobufVersion', protobufVersion
    systemProperty 'voplica.protocVersion', protocVersion
    systemProperty 'voplica.grpcVersion', grpcVersion
}
