// Clones a dataset into the CALLER'S space: memberships + auto_caption_hints, subjects +
// instances (+ embeddings), preparations + items + captions - all as REFERENCES to the same
// content-addressed files (no file bytes are copied). Process history (runs, snapshots,
// training lineage) is NOT cloned. Allowed for the owner, or for any user when the dataset
// is PUBLIC with `download_allowed = true` - this is THE modification path for non-owners
// (the identity/prepared layers of someone else's dataset are read-only).
message CloneDatasetRequest {
  string source_dataset_id = 1;
  // Name of the new dataset. Defaults to the source name + " (copy)".
  optional string name = 2;
}

