  // The new dataset owned by the caller.
  string dataset_id = 1;
  // Populated when the clone runs asynchronously (large datasets); poll the dataset's
  // metadata for readiness. Empty when the clone completed synchronously.
  optional string workflow_execution_id = 2;
}

