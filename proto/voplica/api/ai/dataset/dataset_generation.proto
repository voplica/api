  optional string description = 2;
  // If `false` - only the owner can see or use the dataset.
  voplica.types.base.VisibilityType search_and_use_visibility_type = 3;
  // If `true` anyone who can use the dataset will also be able to download its files.
  bool download_allowed = 4;
  voplica.types.base.MPARating mpa_rating = 5;
  // Typically CHARACTER_GENERIC / CHARACTER_FACE for a generated character dataset.
  voplica.types.ai.common.SubjectCategory best_for_category = 6;
}

