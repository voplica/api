// Inline spec for creating the target dataset as part of `GenerateDatasetImages` - the "generate
// into a NEW dataset" path of the dialog, so the user does not have to create an empty dataset
// first.
//
// Deliberately BOUNDED and deliberately PARTIAL:
//   - `asset_type` is NOT a field. It is forced to `IMAGE_ASSET`; a generation run can only ever
//     write images, and the same rule is validated for an existing `dataset_id`.
//   - the likeness fields (`based_on_likeness_category`,
//     `likeness_granted_permission_verification`) are NOT here. A caller that must declare a
//     real-person likeness calls `DatasetService.CreateDataset` first and passes the resulting
//     `dataset_id` on the `target` oneof instead. Keeping them off the inline path means the
//     inline path can never under-declare them by omission.
//   - `revenue_share` (`CreateDatasetRequest` field 6) is NOT here either, and for the same
//     shape of reason: it is a MONETARY opt-in, and defaulting it from an inline convenience
//     path would enrol a dataset in revenue sharing as a side effect of generating images -
//     a commitment the caller never expressed. Omitted means it takes `CreateDatasetRequest`'s
//     own default (false); a caller who wants revenue sharing creates the dataset explicitly
//     via `DatasetService.CreateDataset` and passes `dataset_id` on the `target` oneof, exactly
//     as with the likeness fields above.
// Everything else defaults exactly as `CreateDatasetRequest` does.
