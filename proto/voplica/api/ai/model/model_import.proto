// Import Models / Model Variants / model files from Civitai and HuggingFace.
service ModelImportService {
  // Inspect an external model (Civitai model or version URL) or repository (HuggingFace URL)
  // with the caller's stored token. A missing/invalid token is reported in token_status with
  // no summary (not an error) so the studio can ask for the token.
  rpc ResolveExternalModel (ResolveExternalModelRequest) returns (ResolveExternalModelResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Create a Model + one variant per selected version + empty preview assets, then start the
  // background download job.
  rpc ImportModel (ImportModelRequest) returns (ImportModelResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // One external version into an existing model of the caller.
  rpc ImportModelVariant (ImportModelVariantRequest) returns (ImportModelVariantResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Model files only (Civitai version files or HuggingFace repository files) into an existing
  // variant whose asset is UNLOCKED.
  rpc ImportModelVariantFiles (ImportModelVariantFilesRequest) returns (ImportModelVariantFilesResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelImport (GetModelImportRequest) returns (GetModelImportResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelImports (ListModelImportsRequest) returns (ListModelImportsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc CancelModelImport (CancelModelImportRequest) returns (CancelModelImportResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
}

