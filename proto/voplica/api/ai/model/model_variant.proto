  // If `false` nobody will be able to download the model.
  bool download_allowed = 5;
  voplica.types.ai.common.ModelFamily model_family = 6;
  repeated string trigger_words = 7;
  // Allows taking missing model variant files from another model variant.
  // Useful when the model variant ships transformer weights only, but needs text encoder, vae, and other parts from
  // a base model.
  // Useful not to upload duplicate model files.
  optional string based_on_model_variant_id = 8;
  // If `true` anyone who can use the model will also be able to train on it: fine-tune these weights further, or train
  // a LoRA on them. If `false` only the owner may. Absent ⇒ `true` (see `ModelVariant.training_allowed`).
  optional bool training_allowed = 9;
  // What the weights are (ModelVariantSamplingRegime). Absent or SAMPLING_REGIME_UNSPECIFIED: the family decides. A
  // value this service does not know is INVALID_ARGUMENT.
  optional voplica.types.ai.model.ModelVariantSamplingRegime sampling_regime = 10;
  // How the platform runs the variant (ModelVariant.inference_strategy). Absent or INFERENCE_STRATEGY_UNSPECIFIED: the
  // family's default, as ModelVariant.inference_strategy describes it. Any other value must be listed in model_family's
  // ModelFamilyExtension.inference_strategies, and the model must be a checkpoint; otherwise INVALID_ARGUMENT.
  optional voplica.types.ai.common.InferenceStrategy inference_strategy = 11;
  // The prompt-writing profile for the variant's requests other than NSFW ones (ModelVariant.prompt_profile). Absent,
  // empty or "default": the family's default. Any other value must be a key ListPromptProfiles offers the variant's
  // owner for model_family, and the model must be a checkpoint; otherwise INVALID_ARGUMENT.
  optional string prompt_profile = 12;
  // How the platform applies LoRAs on the variant (ModelVariant.lora_usage_strategy). Absent or
  // LORA_USAGE_STRATEGY_UNSPECIFIED: the family's default, as ModelVariant.lora_usage_strategy describes it. Any other
  // value must be listed in model_family's ModelFamilyExtension.lora_usage_strategies, and the model must be a
  // checkpoint; otherwise INVALID_ARGUMENT.
  optional voplica.types.ai.common.LoraUsageStrategy lora_usage_strategy = 13;
  // The prompt-writing profile for the variant's NSFW requests (ModelVariant.nsfw_prompt_profile). Absent, empty or
  // "default": the family's default for NSFW requests, whatever prompt_profile says. Any other value must be a key
  // ListPromptProfiles offers the variant's owner for model_family, and the model must be a checkpoint; otherwise
  // INVALID_ARGUMENT.
  optional string nsfw_prompt_profile = 14;
}

