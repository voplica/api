service TrainingService {
  rpc CreateModelTrainingJob (CreateModelTrainingJobRequest) returns (CreateModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelTrainingJob (GetModelTrainingJobRequest) returns (GetModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Creates a `ModelVariant` from a saved training checkpoint. Used for jobs that had no
  // `output_model_id` (so no variants were created during training), or to publish an
  // additional checkpoint as a variant.
  rpc CreateModelVariantFromTrainingCheckpoint (CreateModelVariantFromTrainingCheckpointRequest) returns (CreateModelVariantFromTrainingCheckpointResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Appends a dataset selection to `training_config.training_datasets`.
  rpc AttachModelTrainingJobDataset (AttachModelTrainingJobDatasetRequest) returns (AttachModelTrainingJobDatasetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Removes a dataset selection from `training_config.training_datasets`.
  rpc DetachModelTrainingJobDataset (DetachModelTrainingJobDatasetRequest) returns (DetachModelTrainingJobDatasetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingJobDatasets (ListModelTrainingJobDatasetsRequest) returns (ListModelTrainingJobDatasetsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Lists the CALLER's own training jobs that selected the given source dataset (useful for
  // showing "my trainings that used this dataset"). Requires auth and never returns other
  // users' jobs - the public aggregate usage is `Dataset.used_count`.
  rpc ListDatasetTrainingJobs (ListDatasetTrainingJobsRequest) returns (ListDatasetTrainingJobsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Lists the CALLER's own training jobs across ALL their models/datasets (the global
  // "my trainings" view: active + past in one place). Never returns other users' jobs.
  // The status filter ORs multiple values (active = [PENDING, RUNNING]).
  rpc ListModelTrainingJobs (ListModelTrainingJobsRequest) returns (ListModelTrainingJobsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Triggers current model sampling (outside the configured epoch/steps gap).
  rpc SampleNowModelTrainingJob (SampleNowModelTrainingJobRequest) returns (SampleNowModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Triggers current model saving (regardless of being mid-epoch).
  rpc SaveNowModelTrainingJobModelVariant (SaveNowModelTrainingJobModelVariantRequest) returns (SaveNowModelTrainingJobModelVariantResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc UpdateModelTrainingJob (UpdateModelTrainingJobRequest) returns (UpdateModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc StartModelTrainingJob (StartModelTrainingJobRequest) returns (StartModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc CancelModelTrainingJob (CancelModelTrainingJobRequest) returns (CancelModelTrainingJobResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelTrainingSamplesGroup (GetModelTrainingSamplesGroupRequest) returns (GetModelTrainingSamplesGroupResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelTrainingSample (GetModelTrainingSampleRequest) returns (GetModelTrainingSampleResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingSampleGroups (ListModelTrainingSampleGroupsRequest) returns (ListModelTrainingSampleGroupsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelTrainingRun (GetModelTrainingRunRequest) returns (GetModelTrainingRunResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingRuns (ListModelTrainingRunsRequest) returns (ListModelTrainingRunsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetModelTrainingCheckpoint (GetModelTrainingCheckpointRequest) returns (GetModelTrainingCheckpointResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingCheckpoints (ListModelTrainingCheckpointsRequest) returns (ListModelTrainingCheckpointsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingMetricsPoints (ListModelTrainingMetricsPointsRequest) returns (ListModelTrainingMetricsPointsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListModelTrainingRunDatasets (ListModelTrainingRunDatasetsRequest) returns (ListModelTrainingRunDatasetsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
}
