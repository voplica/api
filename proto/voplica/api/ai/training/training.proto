message CreateModelTrainingJobRequest {
  // Authoritative training configuration. Dataset selections live in
  // `training_config.training_datasets`.
  voplica.types.ai.training.ModelTrainingConfig training_config = 1;
  // Optional destination `GenModel` for produced checkpoints. When set, each saved
  // checkpoint also creates a `ModelVariant` under this model. When empty, checkpoints are
  // stored against the job only and a variant can be created later via
  // `CreateModelVariantFromTrainingCheckpoint`. Separate from
  // `training_config.base_model_variant_id` and `training_config.continue_training`.
  optional string output_model_id = 2;
}

message CreateModelTrainingJobResponse {
  voplica.types.ai.training.ModelTrainingJob model_training_job = 1;
}

