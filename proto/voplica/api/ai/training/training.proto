message UpdateModelTrainingJobRequest {
  string model_training_job_id = 1;
  // Set the destination model for produced checkpoints. Pass an empty string to detach
  // (future checkpoints will not create variants). Only mutable while the job has not
  // started.
  optional string output_model_id = 2;
  optional voplica.types.ai.training.ModelTrainingStopTrigger stop_trigger = 3;
  optional bool sample_after_save = 4;
  optional uint64 steps_sample_threshold = 5;
  optional voplica.types.ai.training.ModelSavingParams saving_params = 6;
}

message UpdateModelTrainingJobResponse {
  voplica.types.ai.training.ModelTrainingJob model_training_job = 1;
}

message StartModelTrainingJobRequest {
  string model_training_job_id = 1;
  // Optional client-provided idempotency key. A retry (double-click, network replay) with the
  // same key returns the already-started run instead of creating a second one. Independent of
  // the single-in-flight-run rule (a job can have at most one PENDING/RUNNING run).
  optional string idempotency_key = 2;
  voplica.types.workflow.WorkflowPrivacyMode privacy_mode = 3;
}

message StartModelTrainingJobResponse {
  // Root workflow execution id of the started workflow. For training-only runs this is
  // also the inner training workflow execution; for combined `ai.prepare_and_train_model_workflow`
  // runs this is the combined parent execution and the inner training-child execution id
  // is populated on `ModelTrainingRun.workflow_execution_id` after the training child
  // actually starts. The two ids together appear on `ModelTrainingRun` as
  // `root_workflow_execution_id` and `workflow_execution_id`.
  string workflow_execution_id = 1;
  // Persisted training run row id.
  string model_training_run_id = 2;
}

