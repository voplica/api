  // multiple selections for the same dataset, also provide `data_selection_fingerprint`.
  string source_dataset_id = 2;
  // Optional disambiguation for jobs that reference the same dataset multiple times.
  optional string data_selection_fingerprint = 3;
}

message DetachModelTrainingJobDatasetResponse {
  // The updated job after the selection was removed.
  voplica.types.ai.training.ModelTrainingJob model_training_job = 1;
}

