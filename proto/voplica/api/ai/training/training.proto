// Creates a `ModelVariant` from a previously saved training checkpoint. Used when the
// training job had no `output_model_id` (so no variants were created automatically) and the
// user later decides to publish a specific checkpoint as a model variant - or to publish an
// additional checkpoint as a separate variant. The new variant adopts the checkpoint's
// inference-ready weights (`model_asset_id`) and its denormalized `model_family`, and the
// service stamps the checkpoint's `model_variant_id` with the created variant.
message CreateModelVariantFromTrainingCheckpointRequest {
  string checkpoint_id = 1;
  // Destination `GenModel` the new variant is attached to. Must be owned by the caller.
  string model_id = 2;
  // Optional display name for the variant (defaults to the checkpoint name).
  optional string variant_name = 3;
  repeated string trigger_words = 4;
  // If true the variant becomes eligible for revenue sharing. Absent ⇒ defaults from the
  // parent model's `revenue_sharing_preferred`.
  optional bool revenue_share = 5;
  // If true anyone who can use the model can also download the variant files.
  bool download_allowed = 6;
  // Optional base variant to inherit shared model files from (text encoder, VAE, etc.) when
  // the checkpoint only ships the trained weights. Avoids re-uploading multi-GB shared
  // components. See `CreateModelVariantRequest.based_on_model_variant_id`.
  optional string based_on_model_variant_id = 7;
}

message CreateModelVariantFromTrainingCheckpointResponse {
  string model_variant_id = 1;
}

