// Give a CHARACTER-LESS draft its character. ONCE-ONLY, in one direction: unbound -> bound. A bound
// draft can never be re-bound to a different character and can never be un-bound, because the work
// already recorded on it - approved views, iteration history, the anchor - was done FOR the identity
// the wizard is building, and moving that wholesale to another character would silently rewrite what
// somebody approved.
//
// TWO OWNERSHIP PROOFS, checked in this order:
//   1. the DRAFT must be the caller's - a foreign or unknown draft answers the byte-identical
//      NOT_FOUND every other draft RPC answers, BEFORE the character is looked at at all, so this
//      RPC never becomes a way to ask about somebody else's draft;
//   2. the CHARACTER must exist and be the caller's - a foreign character and a non-existent one
//      answer identically, exactly as CreateCharacterLookDraft already answers them.
//
// RETRY SAFETY: re-binding to the SAME character succeeds and changes nothing. That is not a hole in
// once-only - no state moves - and without it a lost response would strand the wizard permanently,
// since the alternative to a retry is a draft that can never be saved. Binding to a DIFFERENT
// character is FAILED_PRECONDITION.
message BindCharacterLookDraftToCharacterRequest {
  string draft_id = 1;
  // Must exist and be OWNED BY THE CALLER. Must not be empty: this RPC binds, it never unbinds.
  string character_id = 2;
}

message BindCharacterLookDraftToCharacterResponse {
  // The bound draft, exactly as GetCharacterLookDraft would return it (no previews - this RPC takes
  // no fetching options, same as Create and Update).
  voplica.types.character.CharacterLookDraft draft = 1;
}

message ListCharacterLookDraftsFilters {
  // Restrict to one lifecycle state - the "continue" surface passes IN_PROGRESS, since terminal
  // drafts stay listable but are not resumable.
  optional voplica.types.character.CharacterLookDraftState state = 1;
}

// Keyset pagination is VERBATIM the ListCharacterLooks shape (limit 3 / cursor 10 / before 11 /
// check_more_available 12; next 2 / prev 3 / more 4) so every list surface on this service pages
// identically.
message ListCharacterLookDraftsRequest {
  string character_id = 1;
  optional ListCharacterLookDraftsFilters filters = 2;
  // Max amount of elements per page
  int64 limit = 3;
  // Extra options for fields fetching
  optional CharacterLookDraftFieldsFetchingOptions fields_fetching_options = 4;
  // true = EVERY draft of the CALLER: the character-less ones and every character's, in one list,
  // `created_at` newest first, the same keyset paging; `character_id` is ignored when set. The client
  // shows each draft's binding from `CharacterLookDraft.character_id` (empty = character-less).
  // Send it with `character_id` empty; the filters and the fetching options apply as in the other
  // modes (`include_character_name` names each bound draft's character).
  bool all_characters = 5;
  // to continue pagination use `next_token` with `before = false` to fetch the next page or
  // `prev_token` with `before = true` to fetch the previous page.
  optional string cursor = 10;
  // Used only with `cursor`. If `false` it means fetch data after cursor. If `true` it means fetch data before cursor.
  bool before = 11;
  // Check limit + 1 to know if there is more data available.
  // By default it is `false`. Meaning that `more_available` flag won't be returned.
  bool check_more_available = 12;
}

message ListCharacterLookDraftsResponse {
  // The CALLER's drafts for that character - or the CALLER's character-less drafts when the request
  // carried an empty `character_id`, or EVERY draft of the CALLER when it carried `all_characters` -
  // ordered by `created_at` (newest first). Never anyone else's, regardless of the character's
  // visibility.
  repeated voplica.types.character.CharacterLookDraft drafts = 1;
  // Token to pass in the next query's Pagination directive to go to the next page
  // It will be missing if this request didn't return any data (i.e. no more data available)
  optional string next_token = 2;
  // Token to pass in the next query's Pagination directive to go to the previous page
  // It will be missing if this request didn't return any data (i.e. no more data available)
  optional string prev_token = 3;
  // Returns if there is more data available (i.e. checks `limit + 1`).
  // Returned only if `check_more_available` is set to `true`
  optional bool more_available = 4;
}

service CharacterService {
  rpc CreateCharacter (CreateCharacterRequest) returns (CreateCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc UpdateCharacter (UpdateCharacterRequest) returns (UpdateCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc UpdateCharacterPublishStatus (UpdateCharacterPublishStatusRequest) returns (UpdateCharacterPublishStatusResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc DeleteCharacter (DeleteCharacterRequest) returns (DeleteCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetCharacter (GetCharacterRequest) returns (GetCharacterResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  rpc GetMultiCharacters (GetMultiCharactersRequest) returns (GetMultiCharactersResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  rpc GetCharacterMetadata (GetCharacterMetadataRequest) returns (GetCharacterMetadataResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  rpc ListCharacters (ListCharactersRequest) returns (ListCharactersResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  // Add dataset to character
  rpc AttachDatasetToCharacter (AttachDatasetToCharacterRequest) returns (AttachDatasetToCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Delete dataset from character
  rpc DetachDatasetFromCharacter (DetachDatasetFromCharacterRequest) returns (DetachDatasetFromCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Get datasets for character
  rpc GetDatasetsForCharacter (GetDatasetsForCharacterRequest) returns (GetDatasetsForCharacterResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  rpc AddCharacterPreviewAsset (AddCharacterPreviewAssetRequest) returns (AddCharacterPreviewAssetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc DeleteCharacterPreviewAsset (DeleteCharacterPreviewAssetRequest) returns (DeleteCharacterPreviewAssetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetCharacterPreviewAssets (GetCharacterPreviewAssetsRequest) returns (GetCharacterPreviewAssetsResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  // Create a named look for a character.
  // Maximum 50 looks per character.
  rpc CreateCharacterLook (CreateCharacterLookRequest) returns (CreateCharacterLookResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc UpdateCharacterLook (UpdateCharacterLookRequest) returns (UpdateCharacterLookResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Delete a look: removes the look asset rows and the look, then re-resolves the character's
  // default look (a manually selected default that is deleted is cleared).
  rpc DeleteCharacterLook (DeleteCharacterLookRequest) returns (DeleteCharacterLookResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Reads follow the CHARACTER's visibility, exactly like GetCharacter / GetCharacterPreviewAssets:
  // anonymous viewers of a public+published character can read its looks.
  rpc GetCharacterLook (GetCharacterLookRequest) returns (GetCharacterLookResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  rpc ListCharacterLooks (ListCharacterLooksRequest) returns (ListCharacterLooksResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
  // Attach an existing IMAGE_ASSET (owned by the character's owner) to a look.
  rpc AddCharacterLookAsset (AddCharacterLookAssetRequest) returns (AddCharacterLookAssetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc RemoveCharacterLookAsset (RemoveCharacterLookAssetRequest) returns (RemoveCharacterLookAssetResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Character look DRAFTS - the resumable wizard session. ALL SEVEN are ANY_USER, reads included:
  // a draft is private in-progress work, so unlike the look reads above it does NOT follow the
  // character's visibility. Reading a draft that is not yours answers exactly as reading one that
  // does not exist (byte-identical NOT_FOUND) - see the anti-enumeration note on the messages.
  rpc CreateCharacterLookDraft (CreateCharacterLookDraftRequest) returns (CreateCharacterLookDraftResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // "Clone and Change" - a saved look re-opened as a fresh draft of the caller's. Owner-only, and
  // a foreign or unknown look answers the same NOT_FOUND every other draft RPC answers. See the
  // request message for what is copied and what deliberately is not.
  rpc CloneCharacterLookToDraft (CloneCharacterLookToDraftRequest) returns (CloneCharacterLookToDraftResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc GetCharacterLookDraft (GetCharacterLookDraftRequest) returns (GetCharacterLookDraftResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc UpdateCharacterLookDraft (UpdateCharacterLookDraftRequest) returns (UpdateCharacterLookDraftResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc DeleteCharacterLookDraft (DeleteCharacterLookDraftRequest) returns (DeleteCharacterLookDraftResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Give a character-less draft its character, once and in one direction. The wizard's
  // new-character run calls this at SAVE, between creating the character and creating the look.
  rpc BindCharacterLookDraftToCharacter (BindCharacterLookDraftToCharacterRequest) returns (BindCharacterLookDraftToCharacterResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  // Lists the CALLER's drafts for a character ("continue building a look"), or - with an empty
  // `character_id` - the caller's CHARACTER-LESS drafts ("continue a new-character run"), or -
  // with `all_characters` - EVERY draft of the caller, character-less and bound, in one list.
  rpc ListCharacterLookDrafts (ListCharacterLookDraftsRequest) returns (ListCharacterLookDraftsResponse) {
    option (auth) = {
      auth_type: ANY_USER,
      pat_allowed: true
    };
  }
  rpc ListCharacterLookAssets (ListCharacterLookAssetsRequest) returns (ListCharacterLookAssetsResponse) {
    option (auth) = {
      auth_type: NOT_REQUIRED,
      pat_allowed: true
    };
  }
}
