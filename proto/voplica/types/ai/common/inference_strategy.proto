// How the platform runs a model variant: the shape of one inference. It is independent of what the weights are
// (ModelVariantSamplingRegime) and of the speed / quality trade-off a request asks for (InferenceMode). The numbers of
// each strategy - resolutions, step counts, how much of the picture the refining pass redraws - and the inference
// modes it applies to are the platform's, per model family, and cannot be set per variant. A variant may choose only a
// strategy its model family lists in ModelFamilyExtension.inference_strategies. A run is charged like any other, by
// the GPU time it uses. Values may be added; a reader that does not know a value treats it as
// INFERENCE_STRATEGY_UNSPECIFIED. Compare values by name.
enum InferenceStrategy {
  // The model family's default strategy. The platform chooses it per family, and may choose one strategy for its own
  // models and another for the models creators upload or import.
  INFERENCE_STRATEGY_UNSPECIFIED = 0;
  // One pass at the requested size.
  INFERENCE_STRATEGY_SINGLE_PASS = 1;
  // A draft pass at a lower resolution, then a short refining pass at the requested size that keeps the draft's
  // composition, motion and soundtrack and redraws the detail. Some inference modes, and videos longer than the model
  // renders in one call, may run a single pass instead; a video run's output reports the recipe it used.
  INFERENCE_STRATEGY_TWO_PASS = 2;
}
