// What KIND OF SUBJECT a thing depicts or targets. One taxonomy reused everywhere:
//   - a `DatasetSubject`'s kind (LOCALIZABLE categories only: CHARACTER_GENERIC, OBJECT,
//     VEHICLE, CLOTHES, ... - things that can be detected/cropped in an image);
//   - a preparation target's category (adds framings like CHARACTER_FACE - a face-framed
//     target of a CHARACTER subject; never a subject kind itself);
//   - whole-image categories (STYLE, BACKGROUND, PLACE, POSE, CONCEPT, GENERIC) - valid for
//     targets, trainings, models, and datasets, but never for subjects (nothing to localize);
//   - a training's / model's / checkpoint's category and a dataset's best-for hint.
enum SubjectCategory {
  SUBJECT_CATEGORY_UNSPECIFIED = 0;
  // Any model. Same as unspecified.
  GENERIC = 1;
  // Specific style
  STYLE = 2;
  // Concept. for example, photo angle, details amount, type of eyes, zoom, tattoo, etc.
  CONCEPT = 3;
  POSE = 4;
  CLOTHES = 5;
  VEHICLE = 6;
  OBJECT = 7;
  BACKGROUND = 8;
  PLACE = 9;
  // Generic character (for example full body character LoRa)
  CHARACTER_GENERIC = 100;
  // Character face only (for example LoRa trained to reproduce a specific face only)
  CHARACTER_FACE = 101;
}
