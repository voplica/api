// How the LEARNING RATE evolves over training (kohya `--lr_scheduler`,
// diffusers `get_scheduler`). This is distinct from the NOISE scheduler that governs the
// diffusion noising process (`TrainingNoiseScheduler`).
//
// `COSINE_WITH_RESTARTS` is the scheduler that consumes
// `StandardTrainingParams.lr_scheduler_cycles`.
enum TrainingLrScheduler {
  TRAINING_LR_SCHEDULER_UNSPECIFIED = 0;
  TRAINING_LR_SCHEDULER_CONSTANT = 1;
  TRAINING_LR_SCHEDULER_CONSTANT_WITH_WARMUP = 2;
  TRAINING_LR_SCHEDULER_COSINE = 3;
  TRAINING_LR_SCHEDULER_COSINE_WITH_RESTARTS = 4;
  TRAINING_LR_SCHEDULER_LINEAR = 5;
  TRAINING_LR_SCHEDULER_POLYNOMIAL = 6;
}
