// The diffusion NOISE scheduler used during training - i.e. how noise is added to / removed
// from latents while computing the training loss (ai-toolkit `train.noise_scheduler`).
// This is distinct from the LEARNING RATE scheduler (`TrainingLrScheduler`).
//
// `TRAINING_NOISE_SCHEDULER_UNSPECIFIED` means "let the trainer pick the canonical scheduler
// for the target `ModelFamily`" (for example FLOWMATCH for FLUX / SD3 / Z-Image flow-matching
// families, DDPM for SDXL). Set an explicit value only to override that default.
enum TrainingNoiseScheduler {
  TRAINING_NOISE_SCHEDULER_UNSPECIFIED = 0;
  // Rectified-flow / flow-matching objective (FLUX, SD3, Z-Image, WAN, LTX, ...).
  TRAINING_NOISE_SCHEDULER_FLOWMATCH = 1;
  // Denoising Diffusion Probabilistic Models objective (SDXL / SD1.5 epsilon or v-prediction).
  TRAINING_NOISE_SCHEDULER_DDPM = 2;
  // Continuous-time EDM-style noising (Karras et al.).
  TRAINING_NOISE_SCHEDULER_EDM = 3;
}
