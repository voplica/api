  // BACKGROUND, PLACE, ...) and plain full-image training. Recipes whose targets are ALL
  // whole-image need no analysis and no subject layer at all (the ANALYSIS-FREE lane).
  // Captioning is an INDEPENDENT axis (`DatasetPreparationCaptioningConfig.formats`):
  // BACKGROUND / PLACE / GENERIC items are routinely auto-captioned; STYLE typically is not.
  IMAGE_TARGET_SUBJECT_MODE_WHOLE_IMAGE = 1;
  // One item PER IN-SCOPE SUBJECT INSTANCE (a group photo yields one item per selected
  // person). WHICH instances are in scope is dataset-level configuration
  // (`DatasetPreparation.subject_scope`) - the recipe stays dataset-agnostic and shareable.
  IMAGE_TARGET_SUBJECT_MODE_PER_SUBJECT_INSTANCE = 2;
}

