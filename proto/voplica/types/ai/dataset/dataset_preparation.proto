// Defines how a preparation run treats artifacts that already exist in the dataset's
// `DatasetPreparation` for the selected source assets.
//
// No-work short-circuit: when the prepared set already contains every expected artifact for
// every selected source asset, the `REUSE_PREPARED_WHEN_COMPATIBLE` and
// `FAIL_IF_ANY_ITEM_MISSING` policies complete without starting any workflow.
// `REPROCESS_ALL_ITEMS` intentionally skips this short-circuit and regenerates everything.
enum DatasetPreparationReusePolicy {
  DATASET_PREPARATION_REUSE_POLICY_UNSPECIFIED = 0;
  // Default policy: prepare only the missing artifacts; keep every existing artifact in the
  // set untouched (including USER_EDITED/USER_AUTHORED overrides).
  DATASET_PREPARATION_REUSE_POLICY_REUSE_PREPARED_WHEN_COMPATIBLE = 1;
  // Regenerate every expected artifact for the selected source assets, replacing existing
  // AUTO_GENERATED entries (user-authored/edited overrides are preserved). Use this when the
  // worker implementation or models changed in a way that cannot be expressed by
  // `implementation_version` alone.
  DATASET_PREPARATION_REUSE_POLICY_REPROCESS_ALL_ITEMS = 2;
  // Do not start work if any selected source asset is missing any expected artifact.
  // Use this to validate a dataset's readiness (for example before training) without paying
  // for any new preparation.
  DATASET_PREPARATION_REUSE_POLICY_FAIL_IF_ANY_ITEM_MISSING = 3;
}

enum PreparedFileKind {
  PREPARED_FILE_KIND_UNSPECIFIED = 0;
  // Primary prepared training sample: image, video clip, or audio segment, depending on
  // the source asset type. Trainers consume one or more samples per item.
  PREPARED_FILE_KIND_TRAINING_SAMPLE = 1;
  // Binary or grayscale mask aligned with a training sample. Filesystem-oriented trainers
  // (e.g. ai-toolkit) consume these directly as their mask inputs.
  PREPARED_FILE_KIND_MASK = 2;
  // Alpha image (separate file or RGBA variant of a training sample). NOTE: current
  // trainers read transparency from the training sample's OWN alpha channel and take no
  // separate alpha input - this kind exists for compositing/preview pipelines and future
  // trainers; training materialization MAY ignore it.
  PREPARED_FILE_KIND_ALPHA = 3;
  // Machine-readable analysis metadata used to reproduce or refine preparation. Captions
  // are NOT a file kind - they are first-class item state (`PreparedItemCaption`, one per
  // text format). Sidecar caption `.txt` files, when a filesystem-oriented trainer needs
  // them, are generated at training-materialization time from the item's caption of the
  // selected `caption_format` + trigger words.
  PREPARED_FILE_KIND_ANALYSIS_METADATA = 4;
  // Companion audio segment extracted from a video training sample
  // (`VideoDatasetPreparationRecipe.extract_audio`), time-aligned with the item's clip.
  // Needed as its own kind because an item carries at most ONE file per kind and the
  // clip already occupies TRAINING_SAMPLE. Audio-capable video trainers (e.g. LTX
  // `do_audio`) read the MUXED track inside the clip itself; this extracted companion
  // exists for audio-only reuse and inspection.
  PREPARED_FILE_KIND_AUDIO_TRACK = 5;
}

// Crop policy used by image preparation when fitting a source image into a target.
enum ImageDatasetCropPolicy {
  IMAGE_DATASET_CROP_POLICY_UNSPECIFIED = 0;
  // Keep the selected subject fully visible and extend background generatively if needed.
  IMAGE_DATASET_CROP_POLICY_PRESERVE_SUBJECT_EXTEND_BACKGROUND = 1;
  // Keep the selected subject fully visible and pad with plain or generated background.
  IMAGE_DATASET_CROP_POLICY_PRESERVE_SUBJECT_PAD_BACKGROUND = 2;
  // Allow background-only cropping and avoid subject cropping where possible.
  IMAGE_DATASET_CROP_POLICY_CROP_BACKGROUND_ONLY = 3;
  // Allow subject cropping, for example for face-only crops.
