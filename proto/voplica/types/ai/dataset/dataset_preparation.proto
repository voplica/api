  // When true, normalize the mesh into a unit-sized bounding box centered at the origin.
  bool normalize_scale_and_origin = 4;
  // Optional captioning prompt for renders used by multimodal text encoders.
  optional string subject_selection_prompt = 5;
}

// Caption text format. Trainers pick the format compatible with the text encoder(s) of the
// trained model family (SDXL -> TAGS; FLUX/SD3 -> NATURAL_LANGUAGE). Captions live ON
// prepared items, one per format (see `PreparedItemCaption`).
enum DatasetCaptionFormat {
  DATASET_CAPTION_FORMAT_UNSPECIFIED = 0;
  // Short comma-separated tags, commonly used by SD1/SDXL training recipes.
  DATASET_CAPTION_FORMAT_TAGS = 1;
  // Natural-language description, commonly used by FLUX, SD3, video, and multimodal recipes.
  DATASET_CAPTION_FORMAT_NATURAL_LANGUAGE = 2;
  // Verbatim transcript for audio/video recipes.
  DATASET_CAPTION_FORMAT_TRANSCRIPT = 3;
  // Custom format defined by the worker, with details in
  // `DatasetCaptionGenerationConfig.generation_params`.
  DATASET_CAPTION_FORMAT_CUSTOM = 100;
}

// Auto-generation tuning for item captions. The captioner reads, per item: the item's
// TRAINING_SAMPLE crop, the WHOLE source image (context), the membership row's
// `auto_caption_hint`, the target's `category`, and - when the item belongs to a subject -
// the subject's name/description.
message DatasetCaptionGenerationConfig {
  // Optional class word hint fed to the captioner (e.g. "man", "dog", "car"). It becomes part
  // of the generated text as descriptive content; it is NOT a training-time trigger word.
  optional string class_word = 1;
  // Optional fixed prefix/suffix wrapped around the generated text.
  optional string prepend_text = 2;
  optional string append_text = 3;
  voplica.types.ai.common.CaptioningConflictStrategy conflict_strategy = 4;
  // Model families this caption style targets (informational hint for picking a captioner).
  repeated voplica.types.ai.common.ModelFamily target_model_families = 5;
  // Free-form generation parameters consumed by the captioning worker (model name, task
  // token, max tokens, temperature, ...).
  google.protobuf.Struct generation_params = 20;
}

// Who produced a piece of dataset content (a prepared file or a caption).
enum DatasetContentProvenance {
  DATASET_CONTENT_PROVENANCE_UNSPECIFIED = 0;
  // Produced by a worker (preparation or captioning).
  DATASET_CONTENT_PROVENANCE_AUTO_GENERATED = 1;
  // Supplied by the user for a slot no worker had filled (own crop, own mask, own caption).
  DATASET_CONTENT_PROVENANCE_USER_AUTHORED = 2;
  // Auto-generated, then replaced/edited by the user. Re-generation must not overwrite
  // these unless explicitly forced.
  DATASET_CONTENT_PROVENANCE_USER_EDITED = 3;
}

// Which subject instances PER_SUBJECT_INSTANCE targets expand over. Dataset-local
// configuration on the preparation (NOT the recipe - recipes are shareable across datasets
// and their fingerprint must stay dataset-agnostic).
enum DatasetSubjectScopeMode {
  DATASET_SUBJECT_SCOPE_MODE_UNSPECIFIED = 0;
  // Default: only instances assigned to `subject_ids`. Nothing is cropped until the user
  // (or the fast path / a reference-defined subject) put identities in scope - UNASSIGNED
  // and USER_REJECTED instances are never prepared.
  DATASET_SUBJECT_SCOPE_MODE_LISTED_SUBJECTS = 1;
  // Instances assigned to ANY subject identity (never UNASSIGNED/REJECTED ones).
  DATASET_SUBJECT_SCOPE_MODE_ALL_ASSIGNED_SUBJECTS = 2;
}

enum DatasetFastPathMode {
  // Same as AUTO.
  DATASET_FAST_PATH_MODE_UNSPECIFIED = 0;
  // Default: auto-scope only when the dataset has exactly ONE identity with assigned
  // instances (dominant) OR exactly one reference-defined (USER_CREATED with references)
  // subject; otherwise fail with FAILED_PRECONDITION ("curate subjects first").
  DATASET_FAST_PATH_MODE_AUTO = 1;
  // Force the fast path regardless of how many identities exist: auto-scope to ALL
  // identities with assigned instances (equivalent to ALL_ASSIGNED_SUBJECTS).
  DATASET_FAST_PATH_MODE_FORCE = 2;
  // Never auto-scope: an uncurated PER_SUBJECT recipe always fails with
  // FAILED_PRECONDITION until the user sets a subject scope.
  DATASET_FAST_PATH_MODE_DISABLED = 3;
}

message DatasetPreparationSubjectScope {
  DatasetSubjectScopeMode mode = 1;
  // For LISTED_SUBJECTS.
  repeated string subject_ids = 2;
  // Cost guard for crowd photos. 0 = unlimited.
  uint32 max_instances_per_asset_per_target = 3;
  // Fast-path override (applies only while `mode` is unset/empty - a curated scope always
  // wins). UNSPECIFIED = AUTO.
  DatasetFastPathMode fast_path_mode = 4;
}

message DatasetPreparationCaptioningConfig {
  // Formats auto-generated for every item (e.g. [TAGS, NATURAL_LANGUAGE]). Missing formats
  // count as caption WORK in plans/runs. EMPTY disables auto-captioning (typical for STYLE -
  // items then train caption-less with trigger words only). Independent of the targets'
  // `subject_mode`: whole-image BACKGROUND/PLACE items are captioned like any crop (the
  // "crop" is the whole-image variant).
  repeated DatasetCaptionFormat formats = 1;
  DatasetCaptionGenerationConfig generation_config = 2;
}

// The mutable container of prepared items for one (source_dataset, recipe). Find-or-created
// by `PrepareDataset` (or at training start for recipe selections).
message DatasetPreparation {
  string id = 1;
  string source_dataset_id = 2;
  // Recipe this preparation materializes (persistent id when available; always carries the
  // fingerprint). Unique key: (source_dataset_id, recipe_fingerprint).
  optional string recipe_id = 3;
  string recipe_fingerprint = 4;
  voplica.types.base.AssetType asset_type = 5;
  string owner_id = 6;
  // Optional user-assigned display name ("Anna — face+body v2"). Pure display metadata:
  // mutable via `UpdateDatasetPreparationConfig`, settable at `PrepareDataset` time, and
  // NEVER part of any fingerprint or reuse key. UIs list preparations as `name (id)` and
  // fall back to the recipe name / fingerprint when unnamed.
  optional string name = 13;
  // Seconds since epoch.
  uint64 created_at = 7;
  uint64 updated_at = 8;
  // The ONLY change signal, bumped on: item file add/override/reset, caption
  // upsert/delete/generate, exclude/unexclude, and subject reassignment touching this
  // preparation's items. Config changes below do NOT bump it (they alter future planned
  // work, not frozen content).
  uint64 version = 9;
  // Full recipe payload for AD-HOC recipes (no `recipe_id`), persisted so auto-preparation
  // can still resolve the recipe later. Populated in responses only when
  // `GetDatasetPreparationRequest.include_full_recipe = true`.
  optional DatasetPreparationRecipe embedded_recipe = 10;
  // MUTABLE, dataset-local configuration. NOT part of any fingerprint.
  DatasetPreparationSubjectScope subject_scope = 11;
  DatasetPreparationCaptioningConfig captioning = 12;
  uint64 items_count = 20;
  // Distinct source assets having at least one item.
  uint64 prepared_assets_count = 21;
  uint64 excluded_items_count = 22;
}

// One file of a prepared item (at most ONE per kind - service-enforced).
message PreparedItemFile {
  PreparedFileKind kind = 1;
  voplica.types.file.FileInfo file = 2;
  DatasetContentProvenance provenance = 3;
  string prepared_file_fingerprint = 4;
  // Seconds since epoch.
  uint64 updated_at = 5;
}

// One caption of a prepared item (at most ONE per format - service-enforced). The text
// never contains trigger words - those are applied per training selection at load time.
message PreparedItemCaption {
  DatasetCaptionFormat format = 1;
  string text = 2;
  DatasetContentProvenance provenance = 3;
  // Seconds since epoch. Together with `provenance`, lets a UI surface cross-format
  // staleness (the user edited NATURAL_LANGUAGE; TAGS is still AUTO from an older pass).
  uint64 updated_at = 4;
}

// Captioning context assembled on demand (fetching option), so the captioning worker can
// read everything it needs in the same paged stream as the items.
message PreparedItemCaptioningContext {
  // The WHOLE source image (context for describing the crop).
  optional voplica.types.file.FileInfo source_file = 1;
  // The membership row's `auto_caption_hint` ("John, a 30yo man with brown hair").
  optional string auto_caption_hint = 2;
  // The assigned subject's name/description, when any ("Anna"; "gold bracelet with an
  // emerald stone").
  optional string subject_name = 3;
  optional string subject_description = 4;
}

// One training example. Natural key:
// (preparation_id, source_asset_id, subject_instance_id|"", target_key).
message PreparedItem {
  string id = 1;
  string preparation_id = 2;
  string source_dataset_id = 3;
  string source_asset_id = 4;
  // The detected subject instance this item crops (see
  // voplica/types/ai/dataset/dataset_subject.proto). EMPTY for WHOLE_IMAGE targets.
  optional string subject_instance_id = 5;
  // Denormalized CURRENT identity assignment of that instance. Curation rewrites it (and
  // bumps the preparation version - subject labels are frozen snapshot content). Empty for
  // whole-image items and unassigned instances.
  optional string subject_id = 6;
  string target_key = 7;
  // Denormalized from the recipe target - the structural face-vs-body-vs-style
  // discriminator training selections filter by.
  voplica.types.ai.common.SubjectCategory category = 8;
  // At most one per kind.
  repeated PreparedItemFile files = 9;
  // At most one per format.
  repeated PreparedItemCaption captions = 10;
  // Curation: excluded items are omitted from future snapshots (and from training).
  bool excluded = 11;
  optional string excluded_reason = 12;
  optional voplica.types.image.ImageSize resolution = 13;
  optional voplica.types.image.AspectRatioType aspect_ratio = 14;
  string item_fingerprint = 15;
  // Seconds since epoch.
  uint64 created_at = 16;
  uint64 updated_at = 17;
  google.protobuf.Struct metadata = 20;
  // Populated only when requested via `PreparedItemFetchingOptions.include_captioning_context`.
  optional PreparedItemCaptioningContext captioning_context = 21;
}

// Summary of the recipe used by a snapshot, for cheap list rendering.
message DatasetPreparationSnapshotRecipeSummary {
  optional string recipe_id = 1;
  string recipe_fingerprint = 2;
  string implementation_version = 3;
  voplica.types.base.AssetType asset_type = 4;
  // Categories of the recipe's targets (e.g. [CHARACTER_GENERIC, CHARACTER_FACE]).
  repeated voplica.types.ai.common.SubjectCategory target_categories = 5;
  repeated PreparedFileKind required_file_kinds = 6;
  // Recipe display name when a persistent recipe was used. Empty otherwise.
  string recipe_name = 7;
}

// An immutable, instant, lifecycle-free SNAPSHOT of a `DatasetPreparation` at a `version` -
// the frozen training data a run consumed. Find-or-created by `(preparation_id, version)`:
// reused when that version is already frozen, otherwise the current NON-EXCLUDED items
// (files + captions + subject labels) are frozen in one operation. Born complete; never
// changes. Preparation PROGRESS lives on `DatasetPreparationRun`, never here.
message DatasetPreparationSnapshot {
  string id = 1;
  // The preparation and the version this snapshot froze.
  string preparation_id = 2;
  uint64 version = 3;
  string source_dataset_id = 4;
  optional string recipe_id = 5;
  string recipe_fingerprint = 6;
  // Gated by `DatasetPreparationSnapshotFetchingOptions.include_full_recipe`.
  optional DatasetPreparationRecipe embedded_recipe = 7;
  DatasetPreparationSnapshotRecipeSummary recipe_summary = 8;
  // Content identity over the frozen items: hash{preparation_id, version, items sorted by
  // (source_asset_id, subject_instance_id|"", target_key) -> {item_fingerprint,
  // subject_id|"", captions: sorted format -> sha256(text)}}. Covers visuals AND captions
  // AND subject labels - the three things training consumes. Non-unique verify hint.
  string content_fingerprint = 9;
  // Seconds since epoch.
  uint64 created_at = 10;
  uint64 items_count = 11;
  uint64 prepared_assets_count = 12;
  // Distinct subject identities frozen into the items.
  uint64 subjects_count = 13;
  // Capability summary so training resolution can fail fast (e.g. "no MASK files",
  // "no TAGS captions") without paging items.
  repeated PreparedFileKind file_kinds_present = 14;
  repeated DatasetCaptionFormat caption_formats_present = 15;
  // Owner of the preparation at freeze time. Visibility for other users follows the source
  // dataset visibility plus the dataset's `download_allowed` flag.
  string owner_id = 16;
}

// One frozen item of a snapshot - a faithful copy of a `PreparedItem` (files + captions
// nested), so ONE paged read streams complete (image, caption[, mask]) tuples.
message DatasetPreparationSnapshotItem {
  string id = 1;
  string preparation_snapshot_id = 2;
  // Lineage to the live item this row froze.
  string prepared_item_id = 3;
  string source_asset_id = 4;
  optional string subject_instance_id = 5;
  // The identity assignment AT FREEZE TIME (the filter target of training selections).
  optional string subject_id = 6;
  string target_key = 7;
  voplica.types.ai.common.SubjectCategory category = 8;
  repeated PreparedItemFile files = 9;
  repeated PreparedItemCaption captions = 10;
  string item_fingerprint = 11;
  optional voplica.types.image.ImageSize resolution = 12;
  optional voplica.types.image.AspectRatioType aspect_ratio = 13;
}

// One expected-but-missing training example (readiness unit inside plan/run items).
message ExpectedPreparedItem {
  // Empty for WHOLE_IMAGE targets and for assets whose instances are not discovered yet.
  optional string subject_instance_id = 1;
  string target_key = 2;
  // Visual work still needed for this item.
  repeated PreparedFileKind missing_file_kinds = 3;
  // Caption work still needed (per `DatasetPreparationCaptioningConfig.formats`).
  repeated DatasetCaptionFormat missing_caption_formats = 4;
}

message DatasetPreparationPlanItem {
  string source_asset_id = 1;
  string source_file_id = 2;
  string source_item_fingerprint = 3;
  DatasetPreparationPlanAction action = 4;
  // True when the asset has no subject-instance analysis yet and the recipe has
  // PER_SUBJECT_INSTANCE targets: the run will discover + auto-assign instances first, then
  // derive the concrete expected items. `expected_items` is then a lower bound (whole-image
  // targets only).
  bool requires_instance_discovery = 5;
  // Exactly what is missing for this asset. Empty for action=REUSE_PREPARED_ITEM.
  repeated ExpectedPreparedItem expected_items = 6;
  optional string message = 7;
}

// Readiness answer for "what do the selected source assets still need before training?".
// Computed against the dataset's `DatasetPreparation` for the recipe (which may not exist
// yet - then everything is missing).
message DatasetPreparationPlan {
  string source_dataset_id = 1;
  DatasetPreparationReusePolicy reuse_policy = 2;
  string recipe_fingerprint = 3;
  // The preparation the plan was computed against. Empty when none exists yet.
  optional string preparation_id = 4;
  uint64 preparation_version = 5;
  // Per-asset readiness. For very large selections the service MAY truncate this list (the
  // counts below always cover the FULL selection); `items_truncated = true` signals that.
  repeated DatasetPreparationPlanItem items = 6;
  bool items_truncated = 7;
  // Per-asset action counts (v2-compatible semantics).
  uint64 items_to_prepare_count = 8;
  uint64 items_to_reuse_count = 9;
  uint64 items_to_skip_count = 10;
  uint64 items_to_fail_count = 11;
  // Item-granular work counts (what the run would actually produce / cost).
  uint64 expected_items_count = 12;
  uint64 files_to_generate_count = 13;
  uint64 captions_to_generate_count = 14;
  uint64 assets_requiring_instance_discovery_count = 15;
}

// Process-lineage record for one dataset preparation run: "this execution considered THESE
// frozen source inputs and produced/reused items in the dataset's `DatasetPreparation`".
// The run owns everything process-shaped: the frozen work items (paged via
// `ListDatasetPreparationRunItems`), progress counts, and terminal status.
// `DatasetPreparationSnapshot`s are deliberately NOT tied to runs - they are instant freezes
// of the preparation, and one version may have been filled by many runs.
message DatasetPreparationRun {
  string id = 1;
  // The mutable preparation this run writes into.
  string preparation_id = 2;
  string source_dataset_id = 3;
  // Denormalized from the preparation for filtering.
  string recipe_fingerprint = 4;
  // User who triggered the run (and pays for it).
  string owner_id = 5;
  // The workflow execution that runs the preparation: for a standalone preparation run, the root execution; for one
  // started by a combined prepare-and-train run, the child execution (the parent is in `root_workflow_execution_id`).
  // Empty until the execution is launched.
  optional string workflow_execution_id = 6;
  // Root workflow execution that triggered this run. Equals `workflow_execution_id` for
  // standalone runs; the combined parent for prepare-and-train children. Always populated
  // when the run is created (before any workflow starts).
  string root_workflow_execution_id = 7;
  voplica.types.base.JobStatus status = 8;
  // Seconds since epoch.
  uint64 started_at = 9;
  optional uint64 completed_at = 10;
  optional string message = 11;
  // Snapshot of the reuse policy used for this run.
  DatasetPreparationReusePolicy reuse_policy = 12;
  // Fingerprint + size of the run's frozen source snapshot. The item list is paged via
  // `ListDatasetPreparationRunItems` (never embedded).
  string source_snapshot_fingerprint = 13;
  uint64 source_items_count = 14;
  uint64 prepared_items_count = 15;
  uint64 reused_items_count = 16;
  uint64 skipped_items_count = 17;
  uint64 failed_items_count = 18;
  // Item-granular outcome counts.
  uint64 files_generated_count = 19;
  uint64 captions_generated_count = 20;
}

// One frozen work item of a preparation run: the source item the run considered plus its
// planned action and exactly which files/captions were missing at plan time. Persisted at
// `PrepareDataset` time and paged via `ListDatasetPreparationRunItems`. Authoritative for
// the worker - it MUST NOT re-query dataset membership.
message DatasetPreparationRunItem {
  string preparation_run_id = 1;
  DatasetPreparationSourceItemSnapshot source_item = 2;
  DatasetPreparationPlanAction planned_action = 3;
  bool requires_instance_discovery = 4;
  repeated ExpectedPreparedItem expected_items = 5;
  optional string message = 6;
}

message DatasetPreparationSnapshotFetchingOptions {
  // When true, the snapshot response also includes the full `DatasetPreparationRecipe`
  // (resolved either from the persistent recipe row or from the stored ad-hoc payload).
  // Frozen items are never embedded - page them via `ListDatasetPreparationSnapshotItems`.
  bool include_full_recipe = 1;
}

// File hydration + context assembly for prepared items and frozen snapshot items.
message PreparedItemFetchingOptions {
  // When set, item file `FileInfo`s are hydrated with their variants.
  optional voplica.types.file.FilesRetriever files_retriever = 1;
  // When true, `PreparedItem.captioning_context` is populated (source file + hint +
  // subject name/description) - the captioning worker's one-stream read.
  bool include_captioning_context = 2;
}
