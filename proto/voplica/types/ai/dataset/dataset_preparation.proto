  DATASET_PREPARATION_PLAN_ACTION_REUSE_PREPARED_ITEM = 1;
  // The source asset is missing at least one expected file or caption (`expected_items`
  // lists exactly which) and requires preparation work.
  DATASET_PREPARATION_PLAN_ACTION_PREPARE_ITEM = 2;
  // The source asset should not be prepared, for example because no target subject was
