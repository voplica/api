  // state here ("the family decides"), not the absence of one, and it is what every variant that predates
  // this field reads as.
  ModelVariantSamplingRegime sampling_regime = 15;
  optional string creator_id = 23;
  reserved 16 to 22;
  uint64 likes_count = 31;
  uint64 used_count = 32;
  // Engagement metrics (read-only, updated by the platform). Renamed from checks_count/views_count -- see the
