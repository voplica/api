// How a model variant's weights want to be sampled - declared by a person, because nothing detects it. A
// step-distilled checkpoint (Turbo / Lightning / Hyper) converges in about 8 steps with guidance off; the same
// family's undistilled weights need the family's full step count with CFG on. A version name often says which
// ("v2.5 FP8 Turbo"), but plenty of undistilled finetunes carry the same words, so the studio may suggest a regime
// from the name and never applies one silently.
enum ModelVariantSamplingRegime {
  // Nobody has declared anything: the inference worker's (family, inference mode) profile decides, exactly as it
  // did before this field existed. The default for every variant ever created.
  SAMPLING_REGIME_UNSPECIFIED = 0;
  // The weights are step-distilled. Sample the family's DISTILLED recipe (few steps, guidance off).
  SAMPLING_REGIME_STEP_DISTILLED = 1;
  // The weights are undistilled. Sample the family's RAW recipe -- which for a family whose profile assumes
  // distillation (KREA_2: both regimes resolve to 8 steps / guidance 0.0) is the measured recipe declared on
  // that family's raw base registration, and is otherwise unreachable.
  SAMPLING_REGIME_RAW = 2;
}

