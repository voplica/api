  // It's possible to determine output file types from the model family type
  voplica.types.ai.common.ModelFamily model_family = 11;
  // Shows if files were verified for correctness (i.e. that it can actually be used for inference or training).
  // Only models with verified files can be used for inference.
  // Model files can be uploaded / changed only if the status is `UNVERIFIED`. With other statuses model files can't be changed.
  // If the user wants to modify existing files - the verification status will be changed to `UNVERIFIED` automatically.
  voplica.types.base.VerificationStatus files_verification = 12;
  bool inference_enabled = 13;
  bool training_enabled = 14;
  // The owner's (or an admin's) manual declaration of how these weights want to be sampled. Public, like the
