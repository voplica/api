  // If the dataset is of a likeness of a real person or copyright non-free content then
  // the permission should be granted explicitly.
  voplica.types.base.LikenessCategory likeness_category = 19;
  // When true, a model variant of this model is PUBLISHED automatically as soon as its files
  // verify VALID AND this model's likeness declaration is itself VERIFICATION_VALID. Defaults to
