// Assets essentially are a group of files representing the same thing.
// In some cases they may look similar to FileType (one-2-one mapping);
// For example Image asset usually consists of just one Image file.
// However, in other cases, an asset may consist of different types of files. For example:
// - Video asset may consist of the video stream, audio stream, poster image, subtitles, etc.
// - Base model asset may consist of different configuration and model weight files.
enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  IMAGE_ASSET = 2;
  VIDEO_ASSET = 3;
  AUDIO_ASSET = 4;
  MODEL_GEN_ASSET = 7;
  MODEL_3D_ASSET = 8;
  VECTOR_GRAPHIC_ASSET = 9;
}
