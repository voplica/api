// Moderation state of a piece of content.
// Set by the platform's MPA analysis (FLAGGED) and by admin review decisions (REJECTED / APPROVED / TAKEN_DOWN).
enum ContentModerationStatus {
  // No moderation flag.
  CONTENT_MODERATION_STATUS_UNSPECIFIED = 0;
  // Auto-flagged by analysis. Blocked from publishing; sits in the admin review queue.
  FLAGGED = 1;
  // Admin upheld the flag. Publishing stays blocked (terminal block).
  REJECTED = 2;
  // Admin cleared the flag. Content is publishable again (the analysis record stands).
  APPROVED = 3;
  reserved 4;
  reserved "REVIEW_REQUESTED";
  RESTRICTED = 5;
  TAKEN_DOWN = 6;
}
