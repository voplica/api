enum LikenessCategory {
  LIKENESS_CATEGORY_UNSPECIFIED = 0;
  // The content or model is based on the real adult person likeness.
  // Adult person must write consent themselves to give explicit permission.
  ADULT_PERSON = 1;
  // The content or model is based on the real minor person likeness.
  // Minor person requires parents or guardian to give explicit permission.
  MINOR_PERSON = 2;
  // The content or model is not based on the real person likeness or content that has non-free copyright requirements.
  COPYRIGHT_FREE = 3;
  // The content or model is not based on the real person.
  // However, it is based on copyright protected content and / or content that requires commercial licensing.
  // In this case, the producer must explicitly obtain permission to use likeness of such character or content.
  COPYRIGHT_PROTECTED = 4;
}

