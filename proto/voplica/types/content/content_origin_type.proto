// How the content was originally created.
//
// WORKFLOW content was produced by a workflow execution (auto-created or manually
// created from step outputs). UPLOAD content was uploaded directly by the user
// (e.g., content generated externally with Midjourney, ComfyUI, etc.).
//
// Denormalized on ContentPost for efficient filtering — avoids needing to
// inspect the provenance.origin oneof for every query.
enum ContentOriginType {
  CONTENT_ORIGIN_TYPE_UNSPECIFIED = 0;
  // Content produced by the Voplica Workflow Engine
  WORKFLOW = 1;
  // Content uploaded by the user (generated externally or otherwise)
  UPLOAD = 2;
}
