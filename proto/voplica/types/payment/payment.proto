syntax = "proto3";
package voplica.types.payment;
option java_multiple_files = true;
option java_package = "com.voplica.types.payment";
option go_package = "voplica.com/types/payment";
option csharp_namespace = "Voplica.Types.Payment";
import "voplica/types/price/price.proto";
import "voplica/types/base/big_decimal.proto";
import "voplica/types/subscription/studio_subscription_type.proto";
import "voplica/types/workflow/privacy_mode.proto";

enum PaymentMode {
  PAYMENT_MODE_UNSPECIFIED = 0;
  SUBSCRIPTION = 1;
  PAYMENT = 2;
  SETUP = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  INIT = 1;
  REGISTERED = 2;
  SUCCESS = 3;
  FAILURE = 4;
}

enum ReconciliationState {
  RECONCILIATION_STATE_UNSPECIFIED = 0;
  NEW = 1;
  IN_FLIGHT = 2;
  FAILED = 3;
  DONE = 4;
  STALE = 5;
}

enum PaymentTxState {
  PAYMENT_TX_STATE_UNSPECIFIED = 0;
  // Open transaction means that there could be more charges on the same transaction
  TX_OPEN = 1;
  // Closed transaction is finalized and there cannot be any changes to this transactions anymore
  TX_CLOSED = 2;
}

message PaymentDataItem {
  voplica.types.base.BigDecimalValue paid_amount = 1; //price for the item
  voplica.types.price.Price price = 2;
  int64 quantity = 3; // how many of these items user wants to purchase
}

message OperationPaymentTransaction {
  string id = 1;
  string user_id = 2; // User this transaction belongs to
  string idempotency_key = 3; // Transaction-level idempotency key
  uint64 created_timestamp = 4;
  PaymentTxState state = 5;
  optional uint64 updated_timestamp = 6;
  // Reserved credits amount - charged from user immediately when transaction is created.
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 reserved_credits_milli = 7;
  uint64 total_charged_milli = 8;
  bool free_credits_forbidden = 11;
  voplica.types.workflow.WorkflowPrivacyMode privacy_mode = 12;
}

message Payment {
  string id = 1;
  string account_id = 2;
  repeated PaymentDataItem items = 3;
  string currency_code = 4;
  uint64 timestamp = 5;
  optional string stripe_session_id = 6;
  optional string stripe_invoice_id = 7;
  optional string stripe_subscription_id = 8;
  PaymentMode payment_mode = 9;
  PaymentStatus payment_status = 10;
  bool is_applied = 11; //if this payment was applied to billingInfo
  ReconciliationState payment_reconciliation_state = 12; //reconciliation state
  optional string reconciler = 13; //the id of the instance that did the reconciliation on this payment
  optional string billing_reason = 14;
  // Stripe PaymentIntent id (from the invoice or checkout session), populated when the
  // payment is applied. Lets refund/dispute webhook events resolve back to this payment.
  optional string stripe_payment_intent_id = 15;
}

message BillingInfo {
  //  string id           = 1;
  // account_id who owns this account
  string account_id = 2;
  // permanent credits which can be spent across all Voplica services.
  // 1 credit = 1 cent. 100 credits = 1 dollar (could be called "gollar").
  // Stored/wire unit is the milli-credit (1/1000 credit); 1 milli-credit = $0.00001.
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 permanent_credits_milli = 3;
  // same as "permanent_credits", but earned.
  // These credits can act as "permanent_credits",
  // or exchanged and withdrawn to a bank account.
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 earned_credits_milli = 4;
  StudioSubscription studio_subscription = 5; // current studio subscription
  string stripe_customer_id = 6; //id of the customer created in Stripe to manage subscriptions
}

// Spending priority:
// - free_credits (i.e. "gas")
// - subscription_credits
// - permanent_credits
// - earned_credits
message StudioSubscription {
  voplica.types.subscription.StudioSubscriptionType studio_subscription_type = 1; // current studio subscription
  uint64 subscribed_date = 2;
  optional uint64 next_billing_date = 4;
  // same as "permanent_credits", but received from subscription.
  // these credits expire by the time "next_billing_date" is reached.
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 subscription_limit_credits_milli = 5;
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 subscription_spent_credits_milli = 6;
  // free credits can act similarly to "permanent_credits", but they
  // cannot be used to fund other people. Meaning, these credits can never
  // be converted to "earned_credits" for other people.
  // In other words, we can call it "gas" or something else.
  // The meaning of this "gas" is to allow users with Free subscription to
  // generate some content in Voplica Studio or spend it to some Voplica services,
  // which don't directly related to funding someone else's work.
  // This can be called "gas" or "fake_credits" because these credits can't be spent
  // to generate content from models where creator's fee is used.
  // milli-credits (1/1000 credit). 1 credit = 1 cent.
  uint64 free_credits_milli = 7;
  //If user has active subscription, this date contains timestamp when user credits needs to be re-evaluated (new limit and spent)
  optional uint64 next_credit_reset_date = 8;
  //Recurring interval of subscription billing cycle
  voplica.types.price.RecurringInterval recurring_interval = 9;
}
