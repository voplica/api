enum WorkflowChargeDisposition {
  WORKFLOW_CHARGE_DISPOSITION_UNSPECIFIED = 0;
  // The step's charges stand: a user-caused, provider-billed or unknown failure class, or nothing keyed to
  // this step to reverse.
  WORKFLOW_CHARGE_DISPOSITION_CHARGED = 1;
  // A platform failure class: the step's charges were reversed (credits_reversed_milli).
  WORKFLOW_CHARGE_DISPOSITION_REVERSED = 2;
  // The same decision recorded while nothing moves (the switch in LOG_ONLY): credits_reversed_milli is what
  // WOULD have been reversed and is never money returned.
  WORKFLOW_CHARGE_DISPOSITION_WOULD_REVERSE = 3;
  // A reversal was decided and payments did not apply it (refused, unavailable, or a payments without the
  // rpc): the step's charges stand.
  WORKFLOW_CHARGE_DISPOSITION_NOT_APPLIED = 4;
  WORKFLOW_CHARGE_DISPOSITION_NOT_CHARGED = 5;
}
