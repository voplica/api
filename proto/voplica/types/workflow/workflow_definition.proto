  // If they still satisfy then the Step is triggered again with new input and the Step iterator is incremented again.
  // Notice: If no step triggers are defined - it means this step can never be triggered (so, it basically like an unconnected placeholder for future use).
  // Also, it's possible to define `WorkflowStepTriggerVariant` that has no input, no conditions, and no dependencies.
  // It will basically mean that this step always satisfies requirements - meaning it will be triggered again and again infinitely
  // until workflow is stopped.
